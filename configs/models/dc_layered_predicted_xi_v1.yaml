# Opt-in near-deadline predicted-XI override. Does not change PRODUCTION_MODELS
# (still dc_layered_v2). Enable Touchline ingest with FPLT_TOUCHLINE_LINEUPS_ENABLED=1
# and score accuracy via score_predicted_starts before promoting.
name: dc_layered_predicted_xi_v1
extends: dc_layered_v3
overrides:
  components:
    minutes:
      params:
        predicted_xi: true
        predicted_xi_window_hours: 72.0
        predicted_xi_strength: 0.75
