# Frozen pre-CS layered stack after FDB-211 defcon-rate keep (FDB-226).
# Production moved to dc_layered_v4 after FDB-262 CS-only keep (FDB-267).
# Do not edit this file in place — model_id 30367a901721a5d6 is the keep audit.
# Frozen mean-wire predecessor: dc_layered_v2 (pre-4d715b5 identity).
name: dc_layered_v3
kind: dc_layered
params:
  # 10k is cheap insurance vs 5k (n_sims SE study); MC noise still << model gap.
  n_sims: 10000
  # Fallbacks when involvement has no history; involvement_xg overwrites after fit.
  own_goal_weight: 0.05
  p_assist: 0.75
  # P5 fidelity (v1 keeps defaults off).
  cs_red_void_prob: 0.02
  conceded_mode: played
  sample_other: true
  # Hard XI at draw time (soft_squad still nudges the minutes PMF).
  hard_starters: true
  target_starters: 11
components:
  score:
    name: dixon_coles_v2
    kind: dixon_coles
    params:
      xi: 0.0065
      home_advantage: 1.3
      rho: -0.1
      fit_rho: true
      fit_home_advantage: true
      new_team_prior_strength: 3.0
      promoted_prior_strength: 8.0
  minutes:
    name: empirical_minutes_v2
    kind: empirical_minutes_v2
    params:
      windows: [3, 5, 10]
      shrinkage: 5
      doubtful_chance: 0.5
      soft_squad: true
      target_starters: 11.0
      soft_squad_strength: 0.5
      logistic_blend: 0.5
      l2: 1.0
      return_ramp_games: 2.0
      availability_recovery_games: 3.0
      calibrate_chance_flags: true
      chance_cal_min_count: 20
  involvement:
    name: involvement_xg_v1
    kind: involvement_xg
    params:
      window: 10
      shrinkage: 5
      penalty_bonus: 0.3
      xg_blend: 0.7
  other:
    # FDB-211 keep: Poisson P(award)|minutes,position,rate for DC.
    # Frozen mean-wire predecessor is dc_layered_v2; opt-out fork
    # dc_layered_defcon_mean_v1 restores the shrunk 0/2 wire on this parent.
    name: other_player_defcon_rate_v1
    kind: other_player
    params:
      window: 10
      shrinkage: 5
      bps_bonus_weight: 0.5
      defcon_mode: rate
refit: every_gw
seed: 0
