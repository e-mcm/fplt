name: dc_layered_1x2_v1
kind: dc_layered
params:
  # Same stack as dc_layered_v4; score component blends 1X2 toward de-vigged
  # closing books. Does not change the production default dc_layered_v2.
  n_sims: 10000
  own_goal_weight: 0.05
  p_assist: 0.75
  cs_red_void_prob: 0.02
  conceded_mode: played
  sample_other: true
components:
  score:
    name: dixon_coles_1x2_v1
    kind: dixon_coles
    params:
      xi: 0.0065
      home_advantage: 1.3
      rho: -0.1
      fit_rho: true
      fit_home_advantage: true
      new_team_prior_strength: 3.0
      promoted_prior_strength: 8.0
      market_1x2_strength: 1.0
      use_closing_proxy: true
  minutes:
    name: empirical_minutes_v2
    kind: empirical_minutes_v2
    params:
      windows: [3, 5, 10]
      shrinkage: 5
      doubtful_chance: 0.5
      soft_squad: true
      target_starters: 11.0
      soft_squad_strength: 0.5
      logistic_blend: 0.5
      l2: 1.0
      return_ramp_games: 2.0
  involvement:
    name: involvement_xg_v1
    kind: involvement_xg
    params:
      window: 10
      shrinkage: 5
      penalty_bonus: 0.3
      xg_blend: 0.7
  other:
    name: other_player_v1
    kind: other_player
    params:
      window: 10
      shrinkage: 5
      bps_bonus_weight: 0.5
refit: every_gw
seed: 0
