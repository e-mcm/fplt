# Secret rotation calendar (ops-11).
# The scheduled workflow opens a GitHub issue a week before each next_due.
# Owner: bump next_due after rotating; leave next_due empty to skip reminders.

warn_days: 7

rotations:
  - id: r2-tokens
    title: Rotate Cloudflare R2 API tokens
    cadence: yearly
    scope: "GitHub Actions secrets (fplt-gha-writer); ~/.config/fplt/env (fplt-owner); Modal / cloud-agent (fplt-agent)"
    next_due: "2027-01-15"
    secrets:
      - R2_ACCOUNT_ID
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      - FPLT_R2_ACCOUNT_ID
      - FPLT_R2_ACCESS_KEY_ID
      - FPLT_R2_SECRET_ACCESS_KEY
    notes: |
      Recreate the three R2 tokens (gha-writer, owner, agent) together.
      Update GHA secrets, local env, and Modal Secret in the same window.
      See docs/proposals/r2-data-bucket-plan.md §2.3.

  - id: api-football-key
    title: Review / rotate API-Football (API-Sports) key
    cadence: on_plan_change
    scope: "GitHub Actions secret API_FOOTBALL_KEY (aliases APISPORTS_KEY / FPLT_API_FOOTBALL_KEY); local FPLT_API_FOOTBALL_KEY"
    next_due: "2027-06-01"
    secrets:
      - API_FOOTBALL_KEY
      - APISPORTS_KEY
      - FPLT_API_FOOTBALL_KEY
    notes: |
      Rotate when the API-Sports plan changes or the key is leaked.
      The next_due date is a yearly review anchor, not a hard expiry.

  - id: fpl-api-token
    title: Refresh FPL live-team API token
    cadence: ~8h (ops-01 monitors)
    scope: "GitHub Actions secret FPLT_FPL_API_TOKEN; ~/.config/fplt/env"
    next_due: ""
    secrets:
      - FPLT_FPL_API_TOKEN
      - FPLT_ENTRY_ID
    notes: |
      JWT from DevTools expires ~every 8 hours. ops-01 / fplt auth check
      owns day-to-day expiry; leave next_due empty so this calendar skips it.

  - id: ntfy-and-heartbeats
    title: Review ntfy topics and healthchecks.io ping URLs
    cadence: yearly
    scope: "GitHub Actions secrets NTFY_URL, FPLT_NTFY_URL, HC_PING_URL_*"
    next_due: "2027-01-15"
    secrets:
      - NTFY_URL
      - FPLT_NTFY_URL
      - HC_PING_URL_SNAPSHOT
      - HC_PING_URL_UNDERSTAT
      - HC_PING_URL_API_FOOTBALL
      - HC_PING_URL_FOOTBALL_DATA
      - HC_PING_URL_OPS_TICK
      - HC_PING_URL_OPS_CATCHUP
      - HC_PING_URL_RAW_PARITY
      - HC_PING_URL_SECRET_ROTATION
      - HC_PING_URL_CI
    notes: |
      Rotate topic names / ping URLs if leaked; confirm healthchecks.io
      integrations still POST to the same ntfy topic.
      HC_PING_URL_RAW_PARITY is dual-write only (drop after A9).
      HC_PING_URL_CI is the nightly full-CI dead-man's switch (#305).
