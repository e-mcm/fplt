# Nightly performance monitoring (#312). Thresholds live here, not in code.
# Alert only — never fail PRs / CI on timing.

# Rolling median window (nights) computed at read time.
baseline_window: 14

# Alert when a tracked phase is more than this percent slower than baseline.
regression_pct: 50.0

# Require this many consecutive nights above the threshold before alerting.
consecutive_nights: 3

# Ops tick WARNING when total_s exceeds this fraction of the workflow timeout.
ops_budget_pct: 50.0

# Default ops-tick job timeout (minutes); overridden by OPS_TIMEOUT_MINUTES.
ops_timeout_minutes: 90

# Peak-RSS WARN (#372): log when a timed phase's process high-water RSS
# reaches this fraction of runner_memory_gb (GitHub ubuntu-latest ≈ 16 GiB).
runner_memory_gb: 16.0
rss_warn_pct: 70.0

# Phases compared against the rolling median baseline.
tracked_phases:
  - fit
  - predict
  - plan
  - points_pmf
  - optimise/milp
  - mc_bench_total
  - pytest_suite
  - exp_component
