# Live unattended planning (catch-up / pre-deadline sensors).
# Keep this list short — never silently multi-arm live.
#
# Override without a PR via env (takes precedence over this file):
#   FPLT_PRODUCTION_MODELS=dc_layered_v4_native   # comma-separated
#   FPLT_PLAN_HORIZON=3
#
# CLI / make plan still default to DEFAULT_PLAN_HORIZON in
# fplt.optimise.plan; this file only feeds automation.
#
# FDB-267: stack is dc_layered_v4 (CS-only keep, market_cs_strength=0.5).
# FDB-293: PRODUCTION Monte Carlo is native via dc_layered_v4_native
# (mc_backend: native). Requires the fplt-mc wheel from
# https://e-mcm.github.io/fplt/simple/ (Mac arm64 + Linux x86_64).
# Missing wheel fails loud — no silent Python MC fallback.
# Python parent remains dc_layered_v4; frozen pre-CS parent dc_layered_v3.
# Do not edit a released production ModelSpec in place — bump the versioned
# YAML instead.
#
# B11: `pipeline:` is the typed PipelineSpec (data / model / planner /
# policy / env). `models` / `plan_horizon` stay as the short form; they
# must match pipeline.model / pipeline.planner.horizon and the primary line.
#
# B12: `lines:` is the official slate (data model §4.1). Exactly one
# primary (applied); candidates are recorded only. One predict per
# distinct spec at max horizon; one plan per line. Primary is always
# real squad; candidates default to virtual.

models:
  - dc_layered_v4_native
plan_horizon: 3
# Training-history guard (#285): fail ops-tick / catch_up when staged
# history at the deadline has fewer completed prior seasons than this,
# or when a finished current-season GW lacks player_fixture_stats.
min_prior_seasons: 3

# Catch-up (#369): fill only *current-season* checked GWs that live ops
# missed, from this GW onwards — never staged history (vaastav seasons).
# Bounded per tick so one run cannot burn the job timeout; the rest
# continues on the next tick.
catch_up_from_gw: 1
max_catch_up_per_tick: 4
# #346 run identity: outside checkpoints, at most one run per line per
# this many minutes (price/news churn must not re-predict every tick).
min_run_interval_minutes: 60
# #346 freshness: T−90m / T−30m refuse a curated build older than this
# and ntfy instead of planning on stale data.
max_build_age_minutes: 30
# #374: skip light fingerprint (adhoc) runs when a not-yet-done checkpoint
# becomes due within this many minutes, so background work never collides
# with T−24h / T−6h / T−90m / T−30m.
background_quiet_minutes: 45

lines:
  - {line: v4_h3, spec: dc_layered_v4_native, horizon: 3, role: primary}
  - {line: v4_h5, spec: dc_layered_v4_native, horizon: 5, role: candidate, squad_mode: virtual}
  - {line: v4_h7, spec: dc_layered_v4_native, horizon: 7, role: candidate, squad_mode: virtual}
  - {line: v4_h9, spec: dc_layered_v4_native, horizon: 9, role: candidate, squad_mode: virtual}

pipeline:
  data:
    sources:
      odds_capture: false
      fplcache: false
      api_football_injuries: true
    capture_checkpoint: T-90m
  model: dc_layered_v4_native
  planner:
    horizon: 3
    decay: 0.9
    pool:
      target: 130
    mip_gap: 0.001
    time_limit_s: 600
    objective: mean
  policy:
    max_hits: 1
    hit_min_gain: 4.0
    chips:
      scheduler: season_v1
      arm: optimised
      force_play: true
    captain: max_xpts
    lineup_reopt: true
    price_forecast: mean_gw_delta
    bench_weight: 0.0
  env:
    mc_backend: native
