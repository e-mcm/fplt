# Wave B / FDB-85: CS-only market λ vs vanilla DC (strict PIT + prematch).
name: cs_only_market_lambda_ab
kind: data
question: >
  Does borrowing the market's zero-goal (clean-sheet) margin from
  prematch_scheduled odds at strength 0.5 improve CS Brier vs dc_layered_v2
  while keeping DC's 1X2 under strict PIT?
description: >
  CS-only market λ (market_cs_strength=0.5); control keeps production
  dc_layered_v2. Gate on prematch_scheduled deadline coverage.

change:
  lever: data_table
  orientation: opt_in
  slot: score
  control_kind: dixon_coles
  treatment_kind: dixon_coles
  tables: [match_odds]
  features: []
  allow_multi_lever: false
  diff:
    - "consume staged match_odds via market_cs_strength=0.5 (CS margins only)"
  notes: >
    prematch_scheduled under strict PIT; closing proxy left off (DC default).
    Full-strength λ / 1X2 blends stay off. Strength below 1 by design.

control: dc_layered_v2
treatment: dc_layered_cs_v1

window:
  seasons: ["2024-25"]
  from_gw: 1
  to_gw: 38
  seasons_back: 4
  modes: [walk_forward]

suites:
  prediction: false
  components: true
  decisions: false
  steps: 1

gates:
  min_coverage: 0.80
  allow_low_coverage: false
  coverage:
    metric: odds_join
    read: prematch_scheduled
  keep_if:
    components_any: [brier_cs_home, brier_cs_away]
  drop_if:
    coverage_below_min: true
    mean_ppg_gate_fail: true

report:
  title: "CS-only market λ vs dc_layered_v2 (prematch, strict PIT)"
  store_doc: cs-only-market-lambda-eval.md
