# FDB-244: xg_blend dose (production 0.7 vs pure xG 1.0).
# Metrics: goal-share MAE; MID/FWD RMSE (headline RMSE + by_position).
# No PRODUCTION flip — plumbing + promote board only.
name: xg_blend_ab
kind: config
question: >
  Does xg_blend=1.0 (pure Opta/Understat when both exist) beat production
  xg_blend=0.7 on goal-share MAE and player RMSE (MID/FWD slice)?
description: "xg_blend 0.7 vs 1.0 (FDB-244 / lever rank 7)."

change:
  lever: hyperparam
  orientation: opt_in
  slot: involvement
  control_kind: involvement_xg
  treatment_kind: involvement_xg
  tables: [player_fixture_stats]
  features: []
  allow_multi_lever: false
  diff:
    - "components.involvement.params.xg_blend: 0.7 → 1.0"
  notes: >
    Control dc_layered_v4 (xg_blend=0.7). Treatment dc_layered_xg_blend_1_v1.
    Notes cite ~0.7; sibling fork dc_layered_xg_blend_05_v1 for a 0.5 dose.
    Development 2024-25 GW1–20; confirmation GW21–38. No PRODUCTION flip.

control: dc_layered_v4
treatment: dc_layered_xg_blend_1_v1

window:
  seasons: ["2024-25"]
  from_gw: 1
  to_gw: 20
  seasons_back: 4
  modes: [walk_forward]
  note: >
    Development = GW1–20. Confirmation via --from-gw 21 --to-gw 38.
    Do not retune blend on confirmation. Optional 0.5 dose is a separate arm.

suites:
  prediction: true
  components: true
  decisions: false
  steps: 1

gates:
  min_coverage: null
  keep_if:
    components_any: [mae_goal_share]
    prediction_any: [rmse]
  drop_if:
    coverage_below_min: true
    mean_ppg_gate_fail: true

report:
  title: "xg_blend 0.7 vs 1.0 (goal-share MAE / MID-FWD RMSE)"
  store_doc: involvement-xg-blend-setpieces-promote.md
