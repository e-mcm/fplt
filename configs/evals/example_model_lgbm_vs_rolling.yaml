# Scaffold example: full predictor fork (direct LGBM vs rolling baseline).
name: example_model_lgbm_vs_rolling
kind: model
question: "Scaffold only: does lgbm_direct_v1 beat rolling_mean_v1 on Spearman/MAE?"
description: "lgbm_direct_v1 vs rolling_mean_v1 (model_fork shape)"

change:
  lever: model_fork
  orientation: opt_in
  slot: null
  control_kind: rolling_mean
  treatment_kind: lgbm_direct
  tables: []
  features: []
  allow_multi_lever: false
  diff:
    - "kind: rolling_mean → lgbm_direct"
  notes: "For XGB/handwritten swaps, fork lgbm_direct_v1 and change kind only."

control: rolling_mean_v1
treatment: lgbm_direct_v1

window:
  seasons: ["2024-25"]
  from_gw: 1
  to_gw: 10
  seasons_back: 4
  modes: [walk_forward]

suites:
  prediction: true
  components: false
  decisions: false
  steps: 1

gates:
  keep_if:
    prediction_any: [spearman, mae, top10]
  drop_if:
    coverage_below_min: true
    mean_ppg_gate_fail: true

report:
  title: "Example: direct model fork shape"
