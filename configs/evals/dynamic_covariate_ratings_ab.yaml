# FDB-243 / lever rank 6: mid-season rest/congestion/form covariates on DC.
# Plumbing + promote path; do not flip PRODUCTION until a written keep.
name: dynamic_covariate_ratings_ab
kind: config
question: >
  Do predict-time rest / congestion / form covariates on Dixon–Coles
  improve scoreline RPS and log-loss vs production dc_layered_v4?
description: >
  Dynamic / covariate team ratings (FDB-243). Control keeps production
  dc_layered_v4 (CS-only, covariates off). Treatment
  dc_layered_covariate_v1 adds rest_coef / congestion_coef / form_window /
  form_strength on the score slot (allow_multi_lever package). Headline
  slot metrics: scoreline RPS and log-loss. Forecast claim only.

change:
  lever: hyperparam
  orientation: opt_in
  slot: score
  control_kind: dixon_coles
  treatment_kind: dixon_coles
  tables: []
  features: []
  allow_multi_lever: true
  diff:
    - "components.score.params.rest_coef: 0 → 0.05"
    - "components.score.params.congestion_coef: 0 → 0.05"
    - "components.score.params.form_window: 0 → 5"
    - "components.score.params.form_strength: 0 → 0.2"
  notes: >
    One conceptual lever (mid-season covariates). Production CS borrow
    stays on both arms. No new staged table — schedule comes from
    fixtures (+ competition_fixtures when present). Dose is development
    only; do not retune on confirmation.

control: dc_layered_v4
treatment: dc_layered_covariate_v1

window:
  seasons: ["2024-25"]
  from_gw: 1
  to_gw: 20
  seasons_back: 4
  modes: [walk_forward]
  note: >
    Development window (eval protocol §1). Confirmation = 2024-25 GW21–38
    via --from-gw 21 --to-gw 38 (disjoint). Optional second confirm:
    --seasons 2025-26 on finished GWs only. Sealed: unfinished 2025-26 /
    2026-27 GWs. Do not nest GW1–38 primary + GW20–38 confirm.

suites:
  prediction: true
  components: true
  decisions: false
  steps: 1

gates:
  min_coverage: null
  keep_if:
    components_any: [rps, logloss]
    prediction_any: [rmse]
  drop_if:
    mean_ppg_gate_fail: true

report:
  title: "Dynamic/covariate team ratings vs dc_layered_v4 (RPS / log-loss)"
  store_doc: dynamic-covariate-ratings-promote.md
