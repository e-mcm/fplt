# FDB-239: CS-only market λ player/RMSE revisit (Rank-2).
# After keep / FDB-267, production dc_layered_v4 is the CS treatment; nocs is
# opt-out. Components-only board cs_only_market_lambda_ab already showed CS
# Brier↑ / RPS flat. Prematch 1X2 / equal-combine / closing prior stay dropped.
name: cs_only_player_rmse_ab
kind: data
question: >
  Does borrowing the market's zero-goal (clean-sheet) margin from
  prematch_scheduled odds at strength 0.5 improve player-fixture RMSE
  (and keep CS Brier better / RPS not worse) vs vanilla DC under
  strict PIT?
description: >
  CS-only market λ player/RMSE revisit (FDB-239). Treatment production
  dc_layered_v4 (market_cs_strength=0.5). Control opt-out
  dc_layered_nocs_v1. Gate on prematch_scheduled deadline coverage.
  Forecast claim only.

change:
  lever: data_table
  orientation: opt_out
  slot: score
  control_kind: dixon_coles
  treatment_kind: dixon_coles
  tables: [match_odds]
  features: []
  allow_multi_lever: false
  diff:
    - "consume staged match_odds via market_cs_strength=0.5 (CS margins only)"
  notes: >
    prematch_scheduled under strict PIT; closing proxy left off (DC default).
    Full-strength λ / 1X2 blends and forecast_combine_equal stay off.
    Strength 0.5 unchanged from the components-only board — no dose retune
    on confirmation. After FDB-267 keep flip, production is the treatment.

control: dc_layered_nocs_v1
treatment: dc_layered_v4

window:
  seasons: ["2024-25"]
  from_gw: 1
  to_gw: 20
  seasons_back: 4
  modes: [walk_forward]
  note: >
    Development window (eval protocol §1). Confirmation = 2024-25 GW21–38
    via --from-gw 21 --to-gw 38 (disjoint). Optional second confirm:
    --seasons 2025-26 on finished GWs only. Do not use nested GW1–38
    primary + GW20–38 confirm. Sealed: unfinished 2025-26 / 2026-27 GWs.

suites:
  prediction: true
  components: true
  decisions: false
  steps: 1

gates:
  min_coverage: 0.80
  allow_low_coverage: false
  coverage:
    metric: odds_join
    read: prematch_scheduled
  keep_if:
    prediction_any: [rmse]
    components_any: [brier_cs_home, brier_cs_away]
  drop_if:
    coverage_below_min: true
    mean_ppg_gate_fail: true

report:
  title: "CS-only market λ player RMSE vs vanilla DC (prematch, strict PIT)"
  store_doc: cs-only-player-rmse-promote.md
