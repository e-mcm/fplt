# FDB-211: Poisson P(DC award) other_points vs shrunk 0/2 mean wire.
# After keep, production dc_layered_v3 is the rate treatment; mean is opt-out.
name: defcon_rate_ab
kind: config
question: >
  Does a Poisson P(award)|minutes,position,rate defensive-contribution
  prior beat the shrunk 0/2 mean wire on RMSE for 2025-26?
description: "defcon rate model vs other_player mean wire (FDB-211). Opt-out."

change:
  lever: hyperparam
  orientation: opt_out
  slot: other
  control_kind: other_player
  treatment_kind: other_player
  tables: [player_fixture_stats]
  features: []
  allow_multi_lever: false
  diff:
    - "components.other.params.defcon_mode: mean → rate"
  notes: >
    Control dc_layered_defcon_mean_v1 (shrunk 0/2 wire). Treatment
    dc_layered_v3 (other_player_defcon_rate_v1, production after FDB-211 keep /
    FDB-226 rename). Protocol windows (eval-protocol §1): development GW1–19;
    confirmation GW20–38 (disjoint; FDB-255). RMSE headline. Coverage requires
    every target fixture in a DC-awarding season. Forecast claim only —
    decisions suite off (not squad_points).

control: dc_layered_defcon_mean_v1
treatment: dc_layered_v3

window:
  seasons: ["2025-26"]
  from_gw: 1
  to_gw: 19
  seasons_back: 4
  modes: [walk_forward]
  note: >
    Live-only DC awards: 2025-26 only. Development = GW1–19 (default map).
    Confirmation = GW20–38 via --from-gw/--to-gw (non-overlapping). Do not
    use nested GW1–38 primary + GW20–38 confirm (FDB-211 anti-pattern).

suites:
  prediction: true
  components: false
  decisions: false
  steps: 1

gates:
  min_coverage: 1.0
  allow_low_coverage: false
  coverage:
    metric: dc_season_eligible
    read: strict_pit
  keep_if:
    prediction_any: [rmse]
  drop_if:
    coverage_below_min: true
    mean_ppg_gate_fail: true

report:
  title: "Defcon rate P(award) vs mean wire (2025-26)"
  store_doc: defcon-rate-promote.md
