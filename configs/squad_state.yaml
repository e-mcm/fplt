# Starting squad for `fplt plan`. An empty owned list is an initial draft.
# `fplt plan --entry-json` replaces owned and bank from an entry picks payload.
# Owned rows may set purchase_price (sticky) and selling_price; omit purchase
# to default it to selling_price. Sell-on refreshes from as-of list prices.
# `fplt plan --rebuild` clears owned and sets bank = ITB + Σ selling prices.
# Chip remaining/played stay in this file; live plan/automation consume them
# via DEFAULT_LIVE_CHIP_ARM=optimised (scheduler → MILP).
bank: 1000
free_transfers: 1
ft_bank_cap: 5
hit_cost: 4
decay: 0.9
# Retired as primary bench valuation (Wave D1): scenario / EV lineup re-opt
# owns XI, bench order, and captain. Keep 0; values below 0.01 remain allowed
# only as a tiny legacy tie-break in the transfer MILP.
bench_weight: 0
owned: []
chips:
  remaining:
    wildcard: 2
    freehit: 2
    bboost: 2
    "3xc": 2
  played: []
