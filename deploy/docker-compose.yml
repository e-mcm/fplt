# Optional local data volume layout for a future VPS host.
# Production orchestration is GitHub Actions + `fplt` CLI (see docs/design.md §8).
#
# Secrets: put values in a gitignored `.env` next to this file (compose loads it
# for ${…} substitution), or export them in the shell. See deploy/README.md and
# the repo-root `.env.example`. Never commit real values.
services:
  data:
    image: fplt:local
    command: ["sleep", "infinity"]
    environment:
      FPLT_DATA_DIR: /var/lib/fplt
      FPLT_ENTRY_ID: ${FPLT_ENTRY_ID:-}
      FPLT_FPL_API_TOKEN: ${FPLT_FPL_API_TOKEN:-}
      FPLT_FPL_SESSION: ${FPLT_FPL_SESSION:-}
      FPLT_API_FOOTBALL_KEY: ${FPLT_API_FOOTBALL_KEY:-}
      FPLT_NTFY_URL: ${FPLT_NTFY_URL:-}
      FPLT_SMTP_HOST: ${FPLT_SMTP_HOST:-}
      FPLT_SMTP_PORT: ${FPLT_SMTP_PORT:-587}
      FPLT_SMTP_USER: ${FPLT_SMTP_USER:-}
      FPLT_SMTP_PASSWORD: ${FPLT_SMTP_PASSWORD:-}
      FPLT_SMTP_FROM: ${FPLT_SMTP_FROM:-}
      FPLT_SMTP_TO: ${FPLT_SMTP_TO:-}
      FPLT_SMTP_USE_TLS: ${FPLT_SMTP_USE_TLS:-true}
    volumes:
      - data:/var/lib/fplt
volumes:
  data:
