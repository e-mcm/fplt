name: install-rclone
description: Install a pinned rclone static binary (checksum-verified, cached)
inputs:
  version:
    description: >
      rclone release version without leading v. Default matches the pin in
      docs/ops-runbook.md (Tooling pins). Keep those in sync.
    required: false
    default: "1.76.0"
runs:
  using: composite
  steps:
    - name: Cache rclone binary
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: ${{ runner.temp }}/rclone-bin
        key: rclone-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}
    - name: Download rclone static binary
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        RCLONE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64) asset="rclone-v${RCLONE_VERSION}-linux-amd64" ;;
          Linux-ARM64) asset="rclone-v${RCLONE_VERSION}-linux-arm64" ;;
          macOS-ARM64) asset="rclone-v${RCLONE_VERSION}-osx-arm64" ;;
          macOS-X64) asset="rclone-v${RCLONE_VERSION}-osx-amd64" ;;
          *)
            echo "unsupported runner: ${{ runner.os }}-${{ runner.arch }}"
            exit 1
            ;;
        esac
        mkdir -p "${{ runner.temp }}/rclone-bin"
        base="https://github.com/rclone/rclone/releases/download/v${RCLONE_VERSION}"
        curl -fsSL "${base}/${asset}.zip" -o /tmp/rclone.zip
        curl -fsSL "${base}/SHA256SUMS" -o /tmp/rclone-SHA256SUMS
        # SHA256SUMS is PGP-clearsigned; extract the matching zip line and verify.
        sum_line="$(grep -E "[[:space:]]${asset}\\.zip\$" /tmp/rclone-SHA256SUMS | tail -n 1)"
        if [ -z "$sum_line" ]; then
          echo "::error::no SHA256SUMS entry for ${asset}.zip"
          exit 1
        fi
        expected="$(printf '%s\n' "$sum_line" | awk '{print $1}')"
        actual="$(sha256sum /tmp/rclone.zip | awk '{print $1}')"
        if [ "$expected" != "$actual" ]; then
          echo "::error::rclone zip checksum mismatch for ${asset}.zip"
          echo "expected=${expected}"
          echo "actual=${actual}"
          exit 1
        fi
        unzip -o /tmp/rclone.zip -d /tmp
        install -m 755 "/tmp/${asset}/rclone" "${{ runner.temp }}/rclone-bin/rclone"
    - name: Add rclone to PATH
      shell: bash
      run: |
        set -euo pipefail
        echo "${{ runner.temp }}/rclone-bin" >> "$GITHUB_PATH"
        "${{ runner.temp }}/rclone-bin/rclone" version
