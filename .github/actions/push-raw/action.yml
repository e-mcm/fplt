name: push-raw
description: Upload new raw captures to R2 (write-once)
inputs:
  src:
    description: Local directory of raw captures to upload
    required: true
outputs:
  uploaded:
    description: >
      true only after rclone copy (and check) exit 0, or when there is
      nothing new to upload; false on soft-skip off main or upload failure
    value: ${{ steps.result.outputs.uploaded }}
runs:
  using: composite
  steps:
    - name: Gate on R2 credentials
      id: gate
      shell: bash
      run: |
        set -euo pipefail
        missing=false
        if [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] \
          || [ -z "${R2_SECRET_ACCESS_KEY:-}" ] || [ -z "${DATA_BUCKET:-}" ]; then
          missing=true
        fi
        if [ "$missing" = true ]; then
          # Soft-skip only off main / on pull_request (#278). On main, missing
          # environment secrets must fail so notify-failure fires.
          if [ "${GITHUB_EVENT_NAME:-}" != "pull_request" ] \
            && [ "${GITHUB_REF:-}" = "refs/heads/main" ]; then
            echo "::error::R2 credentials or DATA_BUCKET missing on main (configure environment r2 secrets)"
            exit 1
          fi
          echo "soft skip: R2 credentials or DATA_BUCKET unset (configure R2_* secrets and DATA_BUCKET)"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "skip=false" >> "$GITHUB_OUTPUT"
    - name: Install rclone
      if: steps.gate.outputs.skip != 'true'
      uses: ./.github/actions/install-rclone
    - name: Upload raw captures
      id: upload
      if: steps.gate.outputs.skip != 'true'
      shell: bash
      env:
        RCLONE_CONFIG_FPLT_TYPE: s3
        RCLONE_CONFIG_FPLT_PROVIDER: Cloudflare
        RCLONE_CONFIG_FPLT_NO_CHECK_BUCKET: "true"
      run: |
        set -euo pipefail
        export RCLONE_CONFIG_FPLT_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
        export RCLONE_CONFIG_FPLT_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
        export RCLONE_CONFIG_FPLT_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
        # Dot-path guard (#339) lives in push_raw_upload.sh before rclone.
        bash "${{ github.workspace }}/scripts/push_raw_upload.sh" \
          "${{ inputs.src }}" \
          "fplt:${DATA_BUCKET}/raw"
    - name: Record uploaded outcome
      id: result
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ steps.gate.outputs.skip }}" = "true" ]; then
          echo "uploaded=false" >> "$GITHUB_OUTPUT"
        elif [ "${{ steps.upload.outcome }}" = "success" ]; then
          # Prefer the helper's explicit flag when present; else trust outcome.
          helper="${{ steps.upload.outputs.uploaded }}"
          if [ -n "$helper" ]; then
            echo "uploaded=${helper}" >> "$GITHUB_OUTPUT"
          else
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "uploaded=false" >> "$GITHUB_OUTPUT"
        fi
