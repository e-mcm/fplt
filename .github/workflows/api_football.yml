name: api_football

on:
  schedule:
    # Every 6h UTC — free tier ~100 req/day; fetch also skips if <4h old.
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Force a failure to test the ntfy alert (ops-03 / A7)
        type: boolean
        default: false

# Queue overlapping cron + dispatch; never cancel mid-publish (#305).
concurrency:
  group: api_football
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  capture:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: r2
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Simulate failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure }}
        run: |
          echo "simulate_failure requested"
          exit 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Install httpx + PyYAML
        run: pip install httpx pyyaml

      - name: Capture API-Football injuries + cup/Europe fixtures
        env:
          # Prefer repo secret API_FOOTBALL_KEY (also accepts APISPORTS_KEY).
          # Local / Settings name is FPLT_API_FOOTBALL_KEY.
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          FPLT_API_FOOTBALL_KEY: ${{ secrets.FPLT_API_FOOTBALL_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FPLT_API_FOOTBALL_KEY:-}${API_FOOTBALL_KEY:-}${APISPORTS_KEY:-}" ]; then
            echo "No API-Football key in secrets (API_FOOTBALL_KEY / APISPORTS_KEY / FPLT_API_FOOTBALL_KEY); skipping."
            exit 0
          fi
          # Prefer the same resolution order as scripts/fetch_api_football.py; mask it.
          key="${FPLT_API_FOOTBALL_KEY:-${API_FOOTBALL_KEY:-${APISPORTS_KEY:-}}}"
          echo "::add-mask::${key}"
          python scripts/fetch_api_football.py --out "$RUNNER_TEMP/raw"

      - name: Upload to R2
        id: upload
        if: always()
        uses: ./.github/actions/push-raw
        with:
          src: ${{ runner.temp }}/raw
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATA_BUCKET: ${{ vars.DATA_BUCKET }}

      - name: Publish to the snapshots branch
        if: always()
        run: |
          set -euo pipefail
          if [ -z "$(find "$RUNNER_TEMP/raw" -type f -name '*.json.gz' 2>/dev/null | head -n 1)" ]; then
            echo "nothing new to publish"
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin snapshots || true
          if git rev-parse --verify origin/snapshots >/dev/null 2>&1; then
            git checkout --track origin/snapshots
          else
            git checkout --orphan snapshots
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p data
          cp -a "$RUNNER_TEMP/raw/." data/raw/
          git add data/raw
          if git diff --cached --quiet; then
            echo "api_football snapshots already present"
            exit 0
          fi
          git commit -m "Capture API-Football injuries + cup/Europe fixtures"
          git push origin HEAD:snapshots

  # Separate job: publish may check out the snapshots branch and drop .github/actions.
  alerts:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Heartbeat
        if: needs.capture.result == 'success' && needs.capture.outputs.uploaded == 'true'
        uses: ./.github/actions/heartbeat
        with:
          ping_url: ${{ secrets.HC_PING_URL_API_FOOTBALL }}

      - name: Notify failure
        if: needs.capture.result == 'failure'
        uses: ./.github/actions/notify-failure
        with:
          ntfy_url: ${{ secrets.NTFY_URL }}
