name: ops-catchup

# One-shot post-downtime recovery on GHA (mirrors `make ops-catchup`).
# Shares concurrency group `ops` with ops-tick so they never overlap.
# Set repo variable OPS_LIVE=true before enabling real planning on runners.

on:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Force a failure to test the ntfy alert
        type: boolean
        default: false
      source:
        description: Raw fetch source (auto / bucket / branch)
        type: choice
        options: [auto, bucket, branch]
        default: auto
      force_live:
        description: Run planning even when OPS_LIVE is unset
        type: boolean
        default: false
      no_notify:
        description: Skip ntfy/SMTP recommendation push
        type: boolean
        default: false

concurrency:
  group: ops
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: r2
    steps:
      - name: Record job start
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check out prod tag (bootstrap if missing)
        uses: ./.github/actions/checkout-prod

      - name: Simulate failure
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "simulate_failure requested"
          exit 1

      - name: Gate on OPS_LIVE
        id: gate
        run: |
          set -euo pipefail
          live="${{ vars.OPS_LIVE }}"
          force="${{ inputs.force_live }}"
          if [ "$live" = "true" ] || [ "$force" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "OPS_LIVE enabled (or force_live); running ops-catchup"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPS_LIVE unset; scaffolding only (set repo variable OPS_LIVE=true to plan)"
          fi

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        if: steps.gate.outputs.enabled == 'true'
        with:
          enable-cache: true

      - name: Install Python deps
        if: steps.gate.outputs.enabled == 'true'
        run: uv sync --frozen

      - name: Install rclone
        if: steps.gate.outputs.enabled == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Restore ops state cache
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            data/staged
            data/plans
            data/ledger
            data/predictions
            data/artifacts
            data/runs
            data/curated
          key: ops-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ops-state-${{ runner.os }}-

      - name: Run ops-catchup
        if: steps.gate.outputs.enabled == 'true'
        env:
          FPLT_DATA_DIR: ${{ github.workspace }}/data
          FPLT_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          FPLT_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          FPLT_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FPLT_DATA_BUCKET: ${{ vars.DATA_BUCKET }}
          FPLT_LAB_BUCKET: ${{ vars.LAB_BUCKET }}
          FPLT_ENTRY_ID: ${{ secrets.FPLT_ENTRY_ID }}
          FPLT_FPL_API_TOKEN: ${{ secrets.FPLT_FPL_API_TOKEN }}
          FPLT_NTFY_URL: ${{ secrets.FPLT_NTFY_URL }}
          FPLT_PRODUCTION_MODELS: ${{ vars.FPLT_PRODUCTION_MODELS }}
          FPLT_PLAN_HORIZON: ${{ vars.FPLT_PLAN_HORIZON }}
          JOB_STARTED_AT: ${{ env.JOB_STARTED_AT }}
        run: |
          set -euo pipefail
          mkdir -p "$FPLT_DATA_DIR"
          source="${{ inputs.source }}"
          if [ -n "${FPLT_FPL_API_TOKEN:-}" ]; then
            tok="${FPLT_FPL_API_TOKEN#Bearer }"
            tok="${tok#bearer }"
            echo "::add-mask::${tok}"
            echo "::add-mask::Bearer ${tok}"
          fi
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          echo "::add-mask::${remote}"
          extra=()
          if [ "${{ inputs.no_notify }}" = "true" ]; then
            extra+=(--no-notify)
          fi
          uv run fplt ops-catchup --source "$source" --remote "$remote" --branch snapshots "${extra[@]}"
          # Timing table is appended to $GITHUB_STEP_SUMMARY by fplt.automation.ops_timing.

  alerts:
    needs: catchup
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Heartbeat
        if: needs.catchup.result == 'success'
        uses: ./.github/actions/heartbeat
        with:
          ping_url: ${{ secrets.HC_PING_URL_OPS_CATCHUP }}

      - name: Notify failure
        if: needs.catchup.result == 'failure'
        uses: ./.github/actions/notify-failure
        with:
          ntfy_url: ${{ secrets.NTFY_URL }}
