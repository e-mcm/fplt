name: understat

on:
  schedule:
    # After typical Saturday/Sunday kickoffs settle (UTC).
    - cron: "30 22 * * 0,1,6"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Force a failure to test the ntfy alert (ops-03 / A7)
        type: boolean
        default: false

# Queue overlapping cron + dispatch; never cancel mid-publish (#305).
concurrency:
  group: understat
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: r2
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Simulate failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure }}
        run: |
          echo "simulate_failure requested"
          exit 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Install httpx
        run: pip install httpx

      - name: Capture Understat matches
        run: python scripts/fetch_understat.py --out "$RUNNER_TEMP/raw"

      - name: Upload to R2
        id: upload
        if: always()
        uses: ./.github/actions/push-raw
        with:
          src: ${{ runner.temp }}/raw
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATA_BUCKET: ${{ vars.DATA_BUCKET }}

      - name: Publish to the snapshots branch
        if: always()
        run: |
          set -euo pipefail
          if [ -z "$(find "$RUNNER_TEMP/raw" -type f -name '*.json.gz' | head -n 1)" ]; then
            echo "nothing new to publish"
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin snapshots || true
          if git rev-parse --verify origin/snapshots >/dev/null 2>&1; then
            git checkout --track origin/snapshots
          else
            git checkout --orphan snapshots
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p data
          cp -a "$RUNNER_TEMP/raw/." data/raw/
          git add data/raw
          if git diff --cached --quiet; then
            echo "understat snapshots already present"
            exit 0
          fi
          git commit -m "Capture Understat match JSON"
          git push origin HEAD:snapshots

  # Separate job: publish may check out the snapshots branch and drop .github/actions.
  alerts:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Heartbeat
        if: needs.capture.result == 'success' && needs.capture.outputs.uploaded == 'true'
        uses: ./.github/actions/heartbeat
        with:
          ping_url: ${{ secrets.HC_PING_URL_UNDERSTAT }}

      - name: Notify failure
        if: needs.capture.result == 'failure'
        uses: ./.github/actions/notify-failure
        with:
          ntfy_url: ${{ secrets.NTFY_URL }}
