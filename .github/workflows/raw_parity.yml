name: raw-parity

# Weekly one-way check: snapshots branch tip → fplt-data/raw during dual-write
# (rollout A6 / bucket-plan PR 5). Remove or disable after cut-over (A9).

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Force a failure to test the ntfy alert (ops-03)
        type: boolean
        default: false

# Queue overlapping cron + dispatch (#305).
concurrency:
  group: raw_parity
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: r2
    steps:
      - uses: actions/checkout@v4

      - name: Simulate failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure }}
        run: |
          echo "simulate_failure requested"
          exit 1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --frozen

      - name: Install rclone
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Check branch tip vs bucket
        env:
          FPLT_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          FPLT_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          FPLT_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FPLT_DATA_BUCKET: ${{ vars.DATA_BUCKET }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          echo "::add-mask::${remote}"
          uv run fplt data parity --remote "$remote" --branch snapshots

  alerts:
    needs: parity
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Heartbeat
        if: needs.parity.result == 'success'
        uses: ./.github/actions/heartbeat
        with:
          ping_url: ${{ secrets.HC_PING_URL_RAW_PARITY }}

      - name: Notify failure
        if: needs.parity.result == 'failure'
        uses: ./.github/actions/notify-failure
        with:
          ntfy_url: ${{ secrets.NTFY_URL }}
