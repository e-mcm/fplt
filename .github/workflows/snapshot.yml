name: snapshot

on:
  schedule:
    # Every 15 minutes; scripts/snapshot.py throttles writes (15m / 1h / 12h).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Force a failure to test the ntfy alert (ops-03 / A7)
        type: boolean
        default: false

# Queue overlapping cron + dispatch; never cancel mid-publish (#305).
concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  capture:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: r2
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0  # zizmor: ignore[artipacked] job git-pushes with GITHUB_TOKEN

      - name: Check required secrets are non-empty
        uses: ./.github/actions/check-nonempty-env
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          names: R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY
      - name: Simulate failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure }}
        run: |
          echo "simulate_failure requested"
          exit 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Install httpx
        run: pip install httpx

      - name: Capture snapshots
        id: capture
        run: |
          set -euo pipefail
          out="$(python scripts/snapshot.py --out "$RUNNER_TEMP/raw")"
          echo "$out"
          if echo "$out" | grep -q 'static=wrote'; then
            echo "wrote_static=true" >> "$GITHUB_OUTPUT"
          else
            echo "wrote_static=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        if: steps.capture.outputs.wrote_static == 'true'
        with:
          enable-cache: true

      - name: Install Python deps
        if: steps.capture.outputs.wrote_static == 'true'
        run: uv sync --frozen

      - name: Install rclone
        if: steps.capture.outputs.wrote_static == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Run capture sanity gates
        if: steps.capture.outputs.wrote_static == 'true'
        env:
          FPLT_DATA_DIR: ${{ runner.temp }}/data
          FPLT_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          FPLT_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          FPLT_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FPLT_DATA_BUCKET: ${{ vars.DATA_BUCKET }}
          FPLT_NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$FPLT_DATA_DIR"
          uv run fplt data gates --check --new-raw "$RUNNER_TEMP/raw" --notify

      - name: Upload to R2
        id: upload
        if: always()
        uses: ./.github/actions/push-raw
        with:
          src: ${{ runner.temp }}/raw
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATA_BUCKET: ${{ vars.DATA_BUCKET }}

      - name: Publish to the snapshots branch
        if: always()
        run: |
          set -euo pipefail
          if [ -z "$(find "$RUNNER_TEMP/raw" -type f -name '*.json.gz' | head -n 1)" ]; then
            echo "nothing new to publish"
            exit 0
          fi
          # Defence in depth (#339): refuse '.'-prefixed path components.
          python3 scripts/reject_raw_dot_paths.py "$RUNNER_TEMP/raw"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Publish via worktree so the main checkout stays on this ref (#350);
          # push-raw's post step still needs .github/actions here.
          wt="$RUNNER_TEMP/snapshots-wt"
          git fetch origin snapshots || true
          if git rev-parse --verify origin/snapshots >/dev/null 2>&1; then
            git worktree add -B snapshots "$wt" origin/snapshots
          else
            git worktree add --orphan -b snapshots "$wt"
          fi
          mkdir -p "$wt/data/raw"
          cp -a "$RUNNER_TEMP/raw/." "$wt/data/raw/"
          git -C "$wt" add data/raw
          if git -C "$wt" diff --cached --quiet; then
            echo "snapshots already present"
            exit 0
          fi
          git -C "$wt" commit -m "Capture FPL API snapshots"
          git -C "$wt" push origin HEAD:snapshots

  # Incremental curated build (#345). Never fails or blocks a successful capture.
  curate:
    needs: capture
    if: always() && needs.capture.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: r2
    concurrency:
      group: curate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Check required secrets are non-empty
        uses: ./.github/actions/check-nonempty-env
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          names: R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --frozen

      - uses: ./.github/actions/install-rclone

      - name: Curate
        env:
          FPLT_DATA_DIR: ${{ github.workspace }}/data
          FPLT_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          FPLT_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          FPLT_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FPLT_DATA_BUCKET: ${{ vars.DATA_BUCKET }}
          FPLT_LOG_FORMAT: json
        run: |
          set -euo pipefail
          mkdir -p "$FPLT_DATA_DIR"
          uv run fplt data curate --source bucket

  alerts:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Heartbeat
        if: needs.capture.result == 'success' && needs.capture.outputs.uploaded == 'true'
        uses: ./.github/actions/heartbeat
        with:
          ping_url: ${{ secrets.HC_PING_URL_SNAPSHOT }}

      - name: Notify failure
        if: needs.capture.result == 'failure'
        uses: ./.github/actions/notify-failure
        with:
          ntfy_url: ${{ secrets.NTFY_URL }}
