# Owner after #285 merges (do not run from agents — needs R2 write to fplt-data):
#   gh workflow run vaastav.yml -f full=true
#   rclone lsf fplt:fplt-data/raw/vaastav/ -R | head
# Then confirm ops-tick history guard passes (ops-12).
name: vaastav

on:
  schedule:
    # Weekly after weekend results settle (UTC Monday morning).
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: Capture every season (first seed / force full mirror)
        type: boolean
        default: false
      simulate_failure:
        description: Force a failure to test the ntfy alert (ops-03 / A7)
        type: boolean
        default: false

# Queue overlapping cron + dispatch; never cancel mid-publish (#305).
concurrency:
  group: vaastav
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  capture:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: r2
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
      source_ok: ${{ steps.capture.outputs.source_ok }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0  # zizmor: ignore[artipacked] job git-pushes with GITHUB_TOKEN

      - name: Check required secrets are non-empty
        uses: ./.github/actions/check-nonempty-env
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          names: R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY
      - name: Simulate failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure }}
        run: |
          echo "simulate_failure requested"
          exit 1

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      # Capture needs fplt.schemas only — skip the native fplt-mc wheel.
      - name: Install Python deps (fplt-mc-free)
        run: uv sync --frozen --no-install-package fplt-mc

      - uses: ./.github/actions/install-rclone

      - name: Pull capture status
        uses: ./.github/actions/capture-status
        with:
          mode: pull
          source: vaastav
          status_dir: ${{ runner.temp }}/status
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATA_BUCKET: ${{ vars.DATA_BUCKET }}

      - name: Capture vaastav into raw/
        id: capture
        run: |
          set -euo pipefail
          FULL_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            && [ "${{ inputs.full }}" = "true" ]; then
            FULL_FLAG="--full"
          fi
          uv run python scripts/bootstrap_vaastav.py \
            --out "$RUNNER_TEMP/raw" \
            --cache-dir "$RUNNER_TEMP/vaastav_cache" \
            --status-dir "$RUNNER_TEMP/status" \
            $FULL_FLAG

      - name: Upload to R2
        id: upload
        if: always()
        uses: ./.github/actions/push-raw
        with:
          src: ${{ runner.temp }}/raw
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATA_BUCKET: ${{ vars.DATA_BUCKET }}

      # Only after a successful upload so a timed-out R2 push cannot skip seasons (#353).
      - name: Push capture status
        if: steps.upload.outputs.uploaded == 'true'
        uses: ./.github/actions/capture-status
        with:
          mode: push
          source: vaastav
          status_dir: ${{ runner.temp }}/status
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATA_BUCKET: ${{ vars.DATA_BUCKET }}

      - name: Publish to the snapshots branch
        if: always()
        run: |
          set -euo pipefail
          if [ -z "$(find "$RUNNER_TEMP/raw" -type f -name '_source.json' 2>/dev/null | head -n 1)" ]; then
            echo "nothing new to publish"
            exit 0
          fi
          # Defence in depth (#339): refuse '.'-prefixed path components.
          python3 scripts/reject_raw_dot_paths.py "$RUNNER_TEMP/raw"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Publish via worktree so the main checkout stays on this ref (#350);
          # push-raw's post step still needs .github/actions here.
          wt="$RUNNER_TEMP/snapshots-wt"
          git fetch origin snapshots || true
          if git rev-parse --verify origin/snapshots >/dev/null 2>&1; then
            git worktree add -B snapshots "$wt" origin/snapshots
          else
            git worktree add --orphan -b snapshots "$wt"
          fi
          mkdir -p "$wt/data/raw"
          # Exclude '.'-prefixed top-level entries when copying (#339).
          shopt -s nullglob
          for entry in "$RUNNER_TEMP/raw"/*; do
            cp -a "$entry" "$wt/data/raw/"
          done
          # Drop a wrongly committed clone cache if a prior run left a gitlink.
          if [ -e "$wt/data/raw/.vaastav_cache" ]; then
            git -C "$wt" rm -rf --ignore-unmatch data/raw/.vaastav_cache \
              || rm -rf "$wt/data/raw/.vaastav_cache"
          fi
          git -C "$wt" add data/raw
          if git -C "$wt" diff --cached --quiet; then
            echo "vaastav snapshots already present"
            exit 0
          fi
          git -C "$wt" commit -m "Capture vaastav raw seasons"
          git -C "$wt" push origin HEAD:snapshots

  alerts:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Heartbeat
        if: >-
          needs.capture.result == 'success'
          && needs.capture.outputs.uploaded == 'true'
          && needs.capture.outputs.source_ok == 'true'
        uses: ./.github/actions/heartbeat
        with:
          ping_url: ${{ secrets.HC_PING_URL_VAASTAV }}

      - name: Notify failure
        if: needs.capture.result == 'failure' || needs.capture.result == 'cancelled'
        uses: ./.github/actions/notify-failure
        with:
          ntfy_url: ${{ secrets.NTFY_URL }}
          result: ${{ needs.capture.result }}
