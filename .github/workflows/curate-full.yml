name: curate-full

# Weekly full rebuild of curated tables from all of raw/, with sha parity
# against status/curated/latest.json (#345). This is the only job that copies
# all of raw/.

on:
  schedule:
    # Mondays 07:00 UTC (after raw-parity at 06:00)
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Force a failure to test the ntfy alert (ops-03)
        type: boolean
        default: false

concurrency:
  group: curate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  curate_full:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: r2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Check required secrets are non-empty
        uses: ./.github/actions/check-nonempty-env
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          names: R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY

      - name: Simulate failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure }}
        run: |
          echo "simulate_failure requested"
          exit 1

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --frozen

      - uses: ./.github/actions/install-rclone

      - name: Full curate + parity
        env:
          FPLT_DATA_DIR: ${{ github.workspace }}/data
          FPLT_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          FPLT_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          FPLT_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FPLT_DATA_BUCKET: ${{ vars.DATA_BUCKET }}
          FPLT_NTFY_URL: ${{ secrets.NTFY_URL }}
          FPLT_LOG_FORMAT: json
        run: |
          set -euo pipefail
          mkdir -p "$FPLT_DATA_DIR"
          uv run fplt data curate --full --source bucket

  alerts:
    needs: curate_full
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Heartbeat
        if: needs.curate_full.result == 'success'
        uses: ./.github/actions/heartbeat
        with:
          ping_url: ${{ secrets.HC_PING_URL_CURATE_FULL }}

      - name: Notify failure
        if: needs.curate_full.result == 'failure' || needs.curate_full.result == 'cancelled'
        uses: ./.github/actions/notify-failure
        with:
          ntfy_url: ${{ secrets.NTFY_URL }}
          result: ${{ needs.curate_full.result }}
