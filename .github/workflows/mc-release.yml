name: mc-release

# Build and (eventually) publish fplt-mc wheels when the package version changes
# on main. Until the private R2/S3 simple index is provisioned, this workflow
# only builds + uploads GitHub Actions artifacts and prints the publish TODO.

on:
  push:
    branches: [main]
    paths:
      - "mc/pyproject.toml"
  workflow_dispatch:

concurrency:
  group: mc-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-build:
    name: release (${{ matrix.plat }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, plat: linux-x86_64, container: quay.io/pypa/manylinux_2_28_x86_64 }
          - { os: macos-15, plat: macos-arm64 }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: release-${{ matrix.plat }}
      - name: Install toolchain (manylinux)
        if: matrix.plat == 'linux-x86_64'
        run: |
          yum install -y ninja-build git make cmake || true
          if [ -f /opt/rh/gcc-toolset-13/enable ]; then
            # shellcheck disable=SC1091
            source /opt/rh/gcc-toolset-13/enable
            echo "/opt/rh/gcc-toolset-13/root/usr/bin" >> "${GITHUB_PATH}"
          fi
          echo "/opt/python/cp313-cp313/bin" >> "${GITHUB_PATH}"
          /opt/python/cp313-cp313/bin/python -m pip install -U pip build scikit-build-core nanobind
      - name: Install toolchain (macOS)
        if: matrix.plat == 'macos-arm64'
        run: |
          brew install ninja ccache || true
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "${GITHUB_ENV}"
      - uses: actions/setup-python@v5
        if: matrix.plat == 'macos-arm64'
        with:
          python-version: "3.13"
      - name: Install build frontend (macOS)
        if: matrix.plat == 'macos-arm64'
        run: python -m pip install -U pip build scikit-build-core nanobind
      - name: Build wheels
        env:
          CMAKE_CXX_COMPILER: g++
        run: make mc-ci
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheel-${{ matrix.plat }}
          path: dist/*.whl
          if-no-files-found: error

  publish-stub:
    needs: release-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-wheel-*
          merge-multiple: true
      - name: List wheels (index publish deferred)
        run: |
          ls -la dist/
          VERSION=$(grep -E '^version = ' mc/pyproject.toml | head -1 | cut -d'"' -f2)
          echo "fplt-mc==${VERSION} wheels built."
          cat <<'EOF'
          TODO: publish to private R2/S3 PEP 503 simple index once provisioned.
            1. Upload wheels + regenerate simple/fplt-mc/index.html (sha256 fragments).
            2. Open PR "Bump fplt-mc to X.Y.Z" updating root pin + uv lock.
            3. Set UV_INDEX_FPLT_MC_USERNAME / UV_INDEX_FPLT_MC_PASSWORD as agent secrets.
            4. Enable no-build-package = ["fplt-mc"] in root pyproject (already documented).
          Never overwrite a published version.
          EOF
