name: football_data

on:
  schedule:
    # Monthly: growing E0 CSV for the current season (write-once captured_at=day).
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Force a failure to test the ntfy alert (ops-03 / A7)
        type: boolean
        default: false

# Queue overlapping cron + dispatch; never cancel mid-publish (#305).
concurrency:
  group: football_data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  capture:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: r2
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
      source_ok: ${{ steps.capture.outputs.source_ok }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0  # zizmor: ignore[artipacked] job git-pushes with GITHUB_TOKEN
      - name: Simulate failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure }}
        run: |
          echo "simulate_failure requested"
          exit 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Install httpx
        run: pip install httpx

      - uses: ./.github/actions/install-rclone

      - name: Pull capture status
        uses: ./.github/actions/capture-status
        with:
          mode: pull
          source: football_data
          status_dir: ${{ runner.temp }}/status
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATA_BUCKET: ${{ vars.DATA_BUCKET }}

      - name: Capture football-data E0 CSV
        id: capture
        run: |
          set -euo pipefail
          CAPTURED_AT="$(date -u +%Y-%m-%d)"
          python scripts/fetch_football_data.py \
            --out "$RUNNER_TEMP/raw" \
            --captured-at "$CAPTURED_AT" \
            --status-dir "$RUNNER_TEMP/status"
          echo "CAPTURED_AT=$CAPTURED_AT" >> "$GITHUB_ENV"

      - name: Upload to R2
        id: upload
        if: always()
        uses: ./.github/actions/push-raw
        with:
          src: ${{ runner.temp }}/raw
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATA_BUCKET: ${{ vars.DATA_BUCKET }}

      # Only after a successful upload so a timed-out R2 push cannot skip work (#353).
      - name: Push capture status
        if: steps.upload.outputs.uploaded == 'true'
        uses: ./.github/actions/capture-status
        with:
          mode: push
          source: football_data
          status_dir: ${{ runner.temp }}/status
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATA_BUCKET: ${{ vars.DATA_BUCKET }}

      - name: Publish to the snapshots branch
        if: always()
        run: |
          set -euo pipefail
          if [ -z "$(find "$RUNNER_TEMP/raw" -type f -name 'E0.csv' 2>/dev/null | head -n 1)" ]; then
            echo "nothing new to publish"
            exit 0
          fi
          # Defence in depth (#339): refuse '.'-prefixed path components.
          python3 scripts/reject_raw_dot_paths.py "$RUNNER_TEMP/raw"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Publish via worktree so the main checkout stays on this ref (#350);
          # push-raw's post step still needs .github/actions here.
          wt="$RUNNER_TEMP/snapshots-wt"
          git fetch origin snapshots || true
          if git rev-parse --verify origin/snapshots >/dev/null 2>&1; then
            git worktree add -B snapshots "$wt" origin/snapshots
          else
            git worktree add --orphan -b snapshots "$wt"
          fi
          mkdir -p "$wt/data/raw"
          cp -a "$RUNNER_TEMP/raw/." "$wt/data/raw/"
          git -C "$wt" add data/raw
          if git -C "$wt" diff --cached --quiet; then
            echo "football_data snapshots already present"
            exit 0
          fi
          git -C "$wt" commit -m "Capture football-data E0 CSV (${CAPTURED_AT})"
          git -C "$wt" push origin HEAD:snapshots

  alerts:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Heartbeat
        if: >-
          needs.capture.result == 'success'
          && needs.capture.outputs.uploaded == 'true'
          && needs.capture.outputs.source_ok == 'true'
        uses: ./.github/actions/heartbeat
        with:
          ping_url: ${{ secrets.HC_PING_URL_FOOTBALL_DATA }}

      - name: Notify failure
        if: needs.capture.result == 'failure'
        uses: ./.github/actions/notify-failure
        with:
          ntfy_url: ${{ secrets.NTFY_URL }}
