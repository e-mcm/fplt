name: deps-equivalence

# ops-12: Renovate runtime PRs carry label deps:runtime / equivalence.
# This workflow prepares the fixed environment board, optionally executes
# promote-eval when DEPS_EQUIVALENCE_LIVE=true, and posts the verdict.
# Merge of runtime PRs must wait on CI + this check (no Renovate automerge).
# Prod freeze (ops-04): soft-skip until fplt.ops.freeze.in_prod_freeze exists.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to comment on (optional)
        required: false
        type: string
      live:
        description: Force live promote-eval even when DEPS_EQUIVALENCE_LIVE unset
        type: boolean
        default: false

concurrency:
  group: deps-equivalence-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  equivalence:
    permissions:
      contents: read
      pull-requests: write
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.pull_request.labels.*.name, ','), 'equivalence') ||
      contains(join(github.event.pull_request.labels.*.name, ','), 'deps:runtime')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: r2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve refs
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FALLBACK_SHA: ${{ github.sha }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "control=${PR_BASE_SHA}" >> "$GITHUB_OUTPUT"
            echo "treatment=${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
            echo "pr=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "control=${FALLBACK_SHA}" >> "$GITHUB_OUTPUT"
            echo "treatment=${FALLBACK_SHA}" >> "$GITHUB_OUTPUT"
            echo "pr=${INPUT_PR}" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --frozen

      - name: Prod freeze check (ops-04 soft-skip)
        run: uv run fplt deps-equivalence --check-freeze-only

      - name: Decide live execute
        id: live
        run: |
          set -euo pipefail
          live="${{ vars.DEPS_EQUIVALENCE_LIVE }}"
          force="${{ github.event_name == 'workflow_dispatch' && inputs.live }}"
          if [ "$live" = "true" ] || [ "$force" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "DEPS_EQUIVALENCE_LIVE enabled (or force); will execute promote-eval"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DEPS_EQUIVALENCE_LIVE unset; prepare EvalSpec only (soft-skip execute)"
          fi

      - name: Install rclone
        if: steps.live.outputs.enabled == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Refresh feeds for promote-eval
        if: steps.live.outputs.enabled == 'true'
        env:
          FPLT_DATA_DIR: ${{ github.workspace }}/data
          FPLT_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          FPLT_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          FPLT_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FPLT_DATA_BUCKET: ${{ vars.DATA_BUCKET }}
          FPLT_LAB_BUCKET: ${{ vars.LAB_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p "$FPLT_DATA_DIR"
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          echo "::add-mask::${remote}"
          uv run python -c "
          from pathlib import Path
          from fplt.automation.ops_feeds import refresh_ops_feeds
          refresh_ops_feeds(
              Path('${{ github.workspace }}') / 'data',
              source='auto',
              remote='$remote',
              branch='snapshots',
          )
          "

      - name: Run deps-equivalence
        id: run
        env:
          FPLT_DATA_DIR: ${{ github.workspace }}/data
        run: |
          set -euo pipefail
          mkdir -p artifacts/deps-equivalence
          LIVE_FLAG=""
          if [ "${{ steps.live.outputs.enabled }}" = "true" ]; then
            LIVE_FLAG="--live"
          fi
          set +e
          uv run fplt deps-equivalence \
            --control-ref "${{ steps.refs.outputs.control }}" \
            --treatment-ref "${{ steps.refs.outputs.treatment }}" \
            --output-dir artifacts/deps-equivalence \
            $LIVE_FLAG
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          test -f artifacts/deps-equivalence/comment.md

      - name: Post verdict on PR
        if: steps.refs.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr comment "${{ steps.refs.outputs.pr }}" \
            --body-file artifacts/deps-equivalence/comment.md

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: deps-equivalence-${{ github.run_id }}
          path: artifacts/deps-equivalence
          if-no-files-found: warn

      - name: Enforce gate
        run: |
          set -euo pipefail
          code="${{ steps.run.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "deps-equivalence gate failed (exit $code)"
            exit 1
          fi
          echo "deps-equivalence gate ok"
