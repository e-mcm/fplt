name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly full matrix (linux + macos native) regardless of paths (#305).
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Force a failure to test the ntfy alert (#305)
        type: boolean
        default: false

# Cancel superseded PR runs only — never cancel main / schedule / dispatch (#305).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mc: ${{ steps.filter.outputs.mc }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Simulate failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure }}
        run: |
          echo "simulate_failure requested"
          exit 1
      # Git-based filter (no GitHub API) — avoids "Resource not accessible by
      # integration" on private repos with restricted GITHUB_TOKEN scopes.
      - id: filter
        name: Detect mc/ / workflow changes
        run: |
          set -euo pipefail
          # Nightly / manual full CI: always build + test native on linux + macos.
          if [ "${{ github.event_name }}" = "schedule" ] \
            || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mc=true" >> "$GITHUB_OUTPUT"
            echo "full CI: forcing native builds (linux + macos)"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="${{ github.sha }}^"
            fi
          fi
          echo "Comparing ${BASE}...${{ github.sha }}"
          # Only mc/ sources and the mc-release workflow force a native rebuild.
          # Edits to ci.yml alone (e.g. apt install rclone) must not queue the
          # 10×-billable macOS mc path — that left runners cancelled and broke
          # test-macos on a missing wheel artifact.
          if git diff --name-only "$BASE" "${{ github.sha }}" \
            | grep -qE '^(mc/|\.github/workflows/mc-release\.yml)'; then
            echo "mc=true" >> "$GITHUB_OUTPUT"
            echo "mc changes detected"
          else
            echo "mc=false" >> "$GITHUB_OUTPUT"
            echo "no mc changes"
          fi

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python deps
        run: uv sync --frozen
      - name: Ruff + pyright
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
          uv run pyright
      - name: Workflow timeout-minutes lint (ops-11)
        run: uv run python scripts/check_workflow_timeouts.py
      - name: Workflow R2 environment lint (#278)
        run: uv run python scripts/check_workflow_r2_environment.py
      - name: Workflow concurrency lint (#305)
        run: uv run python scripts/check_workflow_concurrency.py
      - name: clang-format (mc/)
        if: needs.changes.outputs.mc == 'true'
        run: |
          uv pip install 'clang-format==18.1.8'
          find mc \( -name '*.hpp' -o -name '*.cpp' -o -name '*.h' -o -name '*.cc' \) \
            -print0 | xargs -0 uv run clang-format --dry-run --Werror

  production-governance:
    name: production-governance (ops-09)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python deps
        run: uv sync --frozen
      - name: Require promote-eval keep for production flips
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > /tmp/pr-body.txt
          uv run fplt governance-check \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.sha }}" \
            --pr-body-file /tmp/pr-body.txt

  version-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.mc == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require version bump when mc/ changes
        run: bash mc/scripts/version_guard.sh origin/${{ github.base_ref || 'main' }}

  mc-build-linux:
    name: mc-build (linux-x86_64)
    needs: [changes, version-guard]
    if: ${{ always() && needs.changes.outputs.mc == 'true' && needs.version-guard.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: wheel-cache
        with:
          path: dist
          key: fplt-mc-linux-x86_64-${{ hashFiles('mc/**') }}
      - name: Install toolchain (manylinux)
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        run: |
          yum install -y ninja-build git make cmake || true
          if [ -f /opt/rh/gcc-toolset-13/enable ]; then
            # shellcheck disable=SC1091
            source /opt/rh/gcc-toolset-13/enable
            echo "/opt/rh/gcc-toolset-13/root/usr/bin" >> "${GITHUB_PATH}"
          fi
          echo "/opt/python/cp313-cp313/bin" >> "${GITHUB_PATH}"
          /opt/python/cp313-cp313/bin/python -m pip install -U pip build scikit-build-core nanobind
      - uses: hendrikmuhs/ccache-action@v1
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        with:
          key: linux-x86_64
      - name: Build + L0 ctest + wheel
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        env:
          CMAKE_CXX_COMPILER: g++
        run: make mc-ci
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl
          if-no-files-found: error

  mc-build-macos:
    name: mc-build (macos-arm64)
    needs: [changes, version-guard]
    if: ${{ always() && needs.changes.outputs.mc == 'true' && needs.version-guard.result != 'failure' }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: wheel-cache
        with:
          path: dist
          key: fplt-mc-macos-arm64-${{ hashFiles('mc/**') }}
      - name: Install toolchain (macOS)
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        run: |
          brew install ninja ccache || true
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "${GITHUB_ENV}"
      - uses: hendrikmuhs/ccache-action@v1
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        with:
          key: macos-arm64
      - uses: actions/setup-python@v5
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.13"
      - name: Install build frontend (macOS)
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        run: python -m pip install -U pip build scikit-build-core nanobind
      - name: Build + L0 ctest + wheel
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        env:
          CMAKE_CXX_COMPILER: c++
        run: make mc-ci
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-arm64
          path: dist/*.whl
          if-no-files-found: error

  sanitizers:
    needs: [changes, version-guard]
    if: ${{ always() && needs.changes.outputs.mc == 'true' && needs.version-guard.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake g++ || \
            (curl -fsSL https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip -o /tmp/ninja.zip \
             && sudo unzip -o /tmp/ninja.zip -d /usr/local/bin)
      - name: Configure ASan+UBSan Debug
        run: |
          cmake -S mc -B mc/build-san -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DFPLT_MC_BUILD_PYTHON=OFF \
            -DFPLT_MC_BUILD_TESTS=ON \
            -DFPLT_MC_SANITIZE=ON
          cmake --build mc/build-san
          ctest --test-dir mc/build-san --output-on-failure

  test-linux:
    name: test (linux-x86_64)
    needs: [changes, mc-build-linux]
    if: ${{ !cancelled() && needs.mc-build-linux.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # fetch-depth 0 so diff-cover can compare against origin/main (#288).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync locked deps (no compile of fplt-mc)
        run: uv sync --frozen
      - name: Install rclone (pinned static binary, cached)
        uses: ./.github/actions/install-rclone
      - name: Download freshly built fplt-mc wheel
        if: needs.changes.outputs.mc == 'true'
        uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: Reinstall artifact wheel
        if: needs.changes.outputs.mc == 'true'
        run: |
          ls -la dist/
          # Prefer manylinux tag; build may leave only one wheel after auditwheel.
          WHEEL=$(ls dist/*manylinux*.whl 2>/dev/null | head -1)
          WHEEL=${WHEEL:-$(ls dist/*.whl | head -1)}
          uv pip install --no-deps --reinstall "$WHEEL"
          uv run python -c "import fplt_mc; print(fplt_mc.build_info())"
      # Python-only PRs skip mc-build; still need the published wheel so
      # dc_layered_v4_native (and other mc_backend=native specs) can construct
      # in the contract / leaderboard suites.
      - name: Install published fplt-mc wheel
        if: needs.changes.outputs.mc != 'true'
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('mc/pyproject.toml','rb'))['project']['version'])")
          uv pip install "fplt-mc==${VERSION}" \
            --index-url "https://e-mcm.github.io/fplt/simple/" \
            --extra-index-url "https://pypi.org/simple/"
          uv run python -c "import fplt_mc; print(fplt_mc.build_info())"
      # Full suite (incl. slow) + xdist; pytest-cov combines worker coverage (#288/#304).
      # No testmon / path skipping — every PR runs the full suite.
      # fail_under=90 is in pyproject.toml; diff-cover enforces ≥95% on PR diffs.
      # Isolation (#306): socket block / randomly / timeout via pyproject addopts;
      # Hypothesis CI profile; pytest-randomly prints the seed in the log.
      - name: Pytest (fplt)
        env:
          HYPOTHESIS_PROFILE: ci
        run: >
          uv run pytest -n auto --cov=fplt --cov-branch
          --cov-report=xml --cov-report=term
          --cov-report=html:htmlcov
          --durations=25
      - name: Diff coverage (≥95% on changed lines)
        if: github.event_name == 'pull_request'
        id: diffcover
        run: |
          set -uo pipefail
          set +e
          REPORT=$(uv run diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=95 2>&1)
          status=$?
          set -e
          echo "$REPORT"
          {
            echo "## Diff coverage"
            echo '```'
            echo "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Coverage summary
        if: always() && hashFiles('coverage.xml') != ''
        run: |
          set -euo pipefail
          python3 <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()
          line_rate = float(root.attrib.get("line-rate", "0"))
          branch_rate = float(root.attrib.get("branch-rate", "0"))
          print("## Coverage")
          print(f"- line-rate: **{line_rate * 100:.2f}%**")
          print(f"- branch-rate: **{branch_rate * 100:.2f}%**")
          print("- gate: `fail_under = 90` (combined line+branch in pyproject.toml)")
          print("- artifact: `coverage-report` (coverage.xml + htmlcov/, 7 days)")
          PY
      - name: Upload coverage report
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7
      - name: Pytest (fplt-mc smoke)
        if: needs.changes.outputs.mc == 'true'
        run: uv run pytest mc/tests -q

  test-macos:
    name: test (macos-arm64)
    needs: [changes, mc-build-macos]
    # macOS is 10× billable; only on mc/ PRs (fresh wheel + smoke).
    # Require success so a cancelled/skipped mc-build does not fail on a
    # missing wheel-macos-arm64 artifact.
    if: ${{ !cancelled() && needs.changes.outputs.mc == 'true' && needs.mc-build-macos.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync locked deps (no compile of fplt-mc)
        run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: wheel-macos-arm64
          path: dist
      - name: Reinstall artifact wheel
        run: |
          ls -la dist/
          WHEEL=$(ls dist/*macosx*.whl dist/*.whl 2>/dev/null | head -1)
          uv pip install --no-deps --reinstall "$WHEEL"
          uv run python -c "import fplt_mc; print(fplt_mc.build_info())"
      # Full fplt suite needs libomp for lightgbm on macOS runners; PR1 only
      # requires the freshly built fplt-mc wheel to import and pass L0 smoke.
      - name: Pytest (fplt-mc smoke)
        run: uv run pytest mc/tests -q

  gate:
    needs: [changes, lint, production-governance, version-guard, mc-build-linux, mc-build-macos, sanitizers, test-linux, test-macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all needed jobs green or skipped
        run: |
          echo "changes=${{ needs.changes.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "production-governance=${{ needs.production-governance.result }}"
          echo "version-guard=${{ needs.version-guard.result }}"
          echo "mc-build-linux=${{ needs.mc-build-linux.result }}"
          echo "mc-build-macos=${{ needs.mc-build-macos.result }}"
          echo "sanitizers=${{ needs.sanitizers.result }}"
          echo "test-linux=${{ needs.test-linux.result }}"
          echo "test-macos=${{ needs.test-macos.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "gate failed"
            exit 1
          fi
          echo "gate ok"
      # Alert on main push / nightly / dispatch — never on PRs (#287, #305).
      - uses: actions/checkout@v4
        if: >-
          always() &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch')
      - name: Notify failure
        if: >-
          failure() &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/notify-failure
        with:
          ntfy_url: ${{ secrets.NTFY_URL }}
      - name: Heartbeat
        if: >-
          success() &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/heartbeat
        with:
          ping_url: ${{ secrets.HC_PING_URL_CI }}
