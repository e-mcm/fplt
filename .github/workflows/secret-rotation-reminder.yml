name: secret-rotation-reminder

# ops-11: open a GitHub issue a week before each next_due in
# configs/ops/secret_rotation.yaml. Idempotent: skips when an open issue
# with the same title already exists. Heartbeat + failure alert per ops-03.

on:
  schedule:
    # Daily 09:00 UTC — cheap; only creates issues inside the warn window.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Force a failure to test the ntfy alert (ops-03)
        type: boolean
        default: false

# Queue overlapping cron + dispatch (#305).
concurrency:
  group: secret-rotation-reminder
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  remind:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Simulate failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure }}
        run: |
          echo "simulate_failure requested"
          exit 1

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --frozen

      - name: Open issues for due rotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%F)
          OUT="$RUNNER_TEMP/rotation-reminders.json"
          uv run python scripts/secret_rotation_reminders.py --today "$TODAY" --json > "$OUT"
          COUNT=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$OUT")
          if [ "$COUNT" = "0" ]; then
            echo "no reminders due for $TODAY"
            exit 0
          fi
          python3 - "$OUT" <<'PY'
          import json, subprocess, sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              payloads = json.load(fh)
          for item in payloads:
              title = item["title"]
              existing = subprocess.check_output(
                  [
                      "gh", "issue", "list",
                      "--state", "open",
                      "--search", f"in:title {title}",
                      "--json", "title",
                      "--jq", ".[].title",
                  ],
                  text=True,
              )
              if title in existing.splitlines():
                  print(f"open issue already exists: {title}")
                  continue
              print(f"creating issue: {title}")
              subprocess.check_call(
                  ["gh", "issue", "create", "--title", title, "--body", item["body"]],
              )
          PY

  alerts:
    needs: remind
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Heartbeat
        if: needs.remind.result == 'success'
        uses: ./.github/actions/heartbeat
        with:
          ping_url: ${{ secrets.HC_PING_URL_SECRET_ROTATION }}

      - name: Notify failure
        if: needs.remind.result == 'failure'
        uses: ./.github/actions/notify-failure
        with:
          ntfy_url: ${{ secrets.NTFY_URL }}
