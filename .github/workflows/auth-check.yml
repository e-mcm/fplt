name: auth-check

# Daily FPL API token expiry monitor (ops-01). Soft-skips when
# FPLT_FPL_API_TOKEN is unset so scaffolding stays green. ops-tick also
# runs the same check at the start of every live tick (deadline-aware).

on:
  schedule:
    # Offset minute avoids top-of-hour GHA congestion.
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Force a failure to test the ntfy alert
        type: boolean
        default: false

# Queue overlapping cron + dispatch (#305).
concurrency:
  group: auth-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: r2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Simulate failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure }}
        run: |
          echo "simulate_failure requested"
          exit 1

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --frozen

      - name: Auth check
        env:
          FPLT_DATA_DIR: ${{ github.workspace }}/data
          FPLT_FPL_API_TOKEN: ${{ secrets.FPLT_FPL_API_TOKEN }}
          FPLT_NTFY_URL: ${{ secrets.FPLT_NTFY_URL }}
          FPLT_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          FPLT_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          FPLT_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FPLT_DATA_BUCKET: ${{ vars.DATA_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p "$FPLT_DATA_DIR"
          if [ -n "${FPLT_FPL_API_TOKEN:-}" ]; then
            tok="${FPLT_FPL_API_TOKEN#Bearer }"
            tok="${tok#bearer }"
            echo "::add-mask::${tok}"
            echo "::add-mask::Bearer ${tok}"
          fi
          # Soft-skip when the secret is unset (scaffolding / CI forks).
          # Exit non-zero on expired / warn / malformed so the alerts job fires.
          # Missing with --allow-missing exits 0.
          uv run fplt auth check --warn-days 3 --deadline-aware --allow-missing

  alerts:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Heartbeat
        if: needs.check.result == 'success'
        uses: ./.github/actions/heartbeat
        with:
          ping_url: ${{ secrets.HC_PING_URL_AUTH_CHECK }}

      - name: Notify failure
        if: needs.check.result == 'failure'
        uses: ./.github/actions/notify-failure
        with:
          ntfy_url: ${{ secrets.NTFY_URL }}
