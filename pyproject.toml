[project]
name = "fplt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "arch>=9.0.0",
    "chromium-reader>=0.1.1",
    "dagster>=1.13.30",
    "highspy>=1.16.0",
    "httpx>=0.28.1",
    "lightgbm>=4.6.0",
    "pandera>=0.19",
    "polars>=2.1.0",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scipy>=1.13",
    "statsmodels>=0.15.0",
]

[project.scripts]
fplt = "fplt.cli:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "nodejs-wheel>=24.19.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.7",
    "streamlit>=1.67.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: tests slower than about 2 seconds"]

[tool.coverage.run]
source = ["fplt"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

# fplt-mc (native kernel under mc/): public GitHub Pages simple index, no
# credentials. Pin after the first mc-release publish to gh-pages:
#
#   dependencies = [..., "fplt-mc==X.Y.Z"]
#   [[tool.uv.index]]
#   name = "fplt-mc"
#   url = "https://e-mcm.github.io/fplt/simple/"
#   explicit = true
#   [tool.uv.sources]
#   fplt-mc = { index = "fplt-mc" }
#   [tool.uv]
#   no-build-package = ["fplt-mc"]
#   required-environments = [
#     "sys_platform == 'darwin' and platform_machine == 'arm64'",
#     "sys_platform == 'linux' and platform_machine == 'x86_64'",
#   ]
#
# Until pinned, CI uploads wheel artifacts and mc-release publishes Pages.
# Do not add fplt-mc as a required dependency before the index has a wheel
# (agents must never compile).
