[project]
name = "fplt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dagster>=1.13.30",
    "dagster-webserver>=1.13.30",
    "httpx>=0.28.1",
    "hydra-core>=1.3",
    "lightgbm>=4.6.0",
    "mlflow>=2.0",
    "pandas>=2.0",
    "pandera>=0.19",
    "polars>=2.1.0",
    "pulp>=3.3.0",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.2",
    "scipy>=1.13",
]

[project.scripts]
fplt = "fplt.cli:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "nodejs-wheel>=24.19.0",
    "pandas-stubs>=3.1.0.261029",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.7",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "scripts"]
# Legacy modules predate strict checking and are deleted in the cleanup milestone.
exclude = [
    "src/fplt/features/engineer.py",
    "src/fplt/models/bonus",
    "src/fplt/models/cards",
    "src/fplt/models/goal_allocation",
    "src/fplt/models/match_score",
    "src/fplt/models/minutes",
    "src/fplt/models/saves",
    "src/fplt/optimisation",
    "src/fplt/pipeline",
    "src/fplt/predict",
    "src/fplt/schemas/legacy.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: tests slower than about 2 seconds"]

[tool.coverage.run]
source = ["fplt"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
